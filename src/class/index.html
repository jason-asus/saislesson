<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Merrya</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <style>
      /* class section */
      .cls {
        margin: 0 auto;
        display: flex;
        justify-content: center;
      }
      /* text_30% + img_45% = 75%  */
      .cls-text {
        width: 30%;
      }
      .cls-img {
        width: 45%;
        margin: 5px 20px;
      }
      .mb-30 {
        margin-bottom: 30px;
      }

      .meet-us {
        margin: 80px auto 100px auto;
        text-align: center;
      }

      /* students avatar */
      .students {
        width: 75%;
        margin: 20px auto;
        display: flex;
        justify-content: space-between;
      }

      .kid {
        width: 33.3%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .kid-img {
        border-radius: 100%;
      }
      .kid-img:hover {
        transform: scale(2);
      }
      .description {
        width: 250px;
        font-size: 12px;
      }
    </style>

    <!-- nav-bar -->
    <nav>
      <label>Merrya</label>
      <ul>
        <li>
          <a href="/src/">Home</a>
          <a href="/src/friends">friends</a>
          <a href="/src/class">class</a>
          <a href="/src/coding">coding</a>
        </li>
      </ul>
    </nav>
    <!-- main -->
    <main>
      <!-- class -->
      <div class="cls">
        <div class="cls-text">
          <div class="title">SAIS GRADE 3</div>
          <div class="subtitle mb-30">we are amazing</div>
          <p>
            My teacher is Ms Natasha and Ms Tina.
          </p>
        </div>
        <img src="/src/class/G2.jpg" class="cls-img" />
      </div>
      <!-- welcome -->
      <div class="title meet-us">meet us in sais</div>

      <!-- students -->
      <div class="students">
        <div class="kid">
          <img src="/src/class/Edward.jpg" class="kid-img" width="160" />
          <div class="subtitle">Merrya</div>
          <p class="description">
           I am 8 years old. I like to play UNO.
            
          </p>
        </div>
        <div class="kid">
          <img src="/src/class/Kamilla.jpg" class="kid-img" width="160" />
          <div class="subtitle">Hardy</div>
          <p class="description">
            His favorite color is yellow.he is 8 years old.
          </p>
        </div>
        <div class="kid">
          <img src="/src/class/Rosy.jpg" class="kid-img" width="160" />
          <div class="subtitle">Jackson
          <p class="description">
             He like to  play.He is 8 years old.
          
          </p>
        </div>
      </div>
 
    </main>

    <script src="" async defer></script>
  </body>
</html>
